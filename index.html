<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Official Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
        }

        .navbar, footer {
            background: #123b70;
            color: white;
        }

        .navbar {
            padding: 12px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: #ffd447 !important;
        }

        .navbar-brand img {
            border-radius: 50%;
        }

        .portal-btn {
            background: #ffd447;
            color: #123b70;
            border-radius: 20px;
        }

        .header-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .welcome-section {
            background: white;
            padding: 60px 15px;
            text-align: center;
        }

        .welcome-section h1, .campus-title {
            color: #123b70;
            font-weight: bold;
        }

        .welcome-section p {
            color: #c89b00;
            letter-spacing: 2px;
        }

        .campus-section {
            padding: 60px 0;
        }

        .campus-title {
            margin-bottom: 35px;
        }

        .campus-card {
            border: none;
            height: 100%;
        }

        .campus-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-body h5 {
            color: #123b70;
        }

        footer {
            padding: 30px;
            text-align: center;
            border-top: 4px solid #ffd447;
        }

        footer h5 {
            color: #ffd447;
        }

        @media (max-width: 991px) {
            .navbar-nav {
                padding-top: 10px;
            }
        }

        @media (max-width: 576px) {
            .header-img {
                height: 250px;
            }

            .welcome-section h1 {
                font-size: 27px;
            }

            .campus-img {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#home">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" width="40" alt="OBMC Logo">
            OBMC
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#campuses" data-bs-toggle="dropdown">Campuses</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#fairview">Fairview</a></li>
                        <li><a class="dropdown-item" href="#angeles">Angeles</a></li>
                        <li><a class="dropdown-item" href="#greenhills">Greenhills</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
            <a href="#" class="btn portal-btn ms-lg-3 mt-2 mt-lg-0">Portal</a>
        </div>
    </div>
</nav>

<header id="home">
    <img src="https://scontent.fmnl13-5.fna.fbcdn.net/v/t39.30808-6/546583695_1205908628236923_7409519030732023944_n.jpg?stp=dst-jpg_tt6&cstp=mx1860x780&ctp=s1860x780&_nc_cat=101&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=86c6b0&_nc_ohc=CMIruHlLeMIQ7kNvwEZUoYo&_nc_oc=AdqUBr57uKHLHnTLPoQBzuy8aDRXX3uHcbIhdTw6VWWIk1mcswAC8-dsu3X5YXEUdbg&_nc_zt=23&_nc_ht=scontent.fmnl13-5.fna&_nc_gid=BAmrG534zCoqgcSWrAqL1w&_nc_ss=7b2a8&oh=00_AQRAmIEfjq6QrhE_Auf1rWQeBRWRQkr9EIsl6Vs_J5tVEA&oe=6AFCE46C" class="header-img" alt="OBMC Header">
</header>

<section id="about" class="welcome-section">
    <h1>Welcome to OBMC</h1>
    <p>A DIAMOND LEGACY OF LEARNING</p>
</section>

<section id="campuses" class="campus-section">
    <div class="container">
        <h2 class="text-center campus-title">Our Campuses</h2>
        <div class="row g-4">

            <div class="col-md-4" id="fairview">
                <div class="card campus-card">
                    <img src="https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg" class="campus-img" alt="Fairview">
                    <div class="card-body text-center"><h5>Fairview</h5></div>
                </div>
            </div>

            <div class="col-md-4" id="angeles">
                <div class="card campus-card">
                    <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MONTESSORI+AN+1+-+AY+2026+FA.jpg" class="campus-img" alt="Angeles">
                    <div class="card-body text-center"><h5>Angeles</h5></div>
                </div>
            </div>

            <div class="col-md-4" id="greenhills">
                <div class="card campus-card">
                    <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9R4cnwHnjbsyl42k5qI9MnpvFtKPNDLm6F4fiHP_JWIFilBOE64A4l_NZlUMbMmXqJoCv5jGNXTgkgV9dMVDMQ5MhU7fPjA-k8Q-5grbksZKZQgV8fJ_9icDyv10TbdeBubumzng7ZUNtjD=s1360-w1360-h1020-rw" class="campus-img" alt="Greenhills">
                    <div class="card-body text-center"><h5>Greenhills</h5></div>
                </div>
            </div>

        </div>
    </div>
</section>

<footer id="contact">
    <h5>OBMC</h5>
    <p>Contact Us | About Us</p>
    <p>© 2026 OBMC. All Rights Reserved.</p>
</footer>

</body>
</html>
